type Category {
  id: ID!
  name: String!
  description: String
  created_at: String
  products: [ProductCBD!]!
}

# Type enrichi pour les statistiques
type CategoryWithCounts {
  id: ID!
  name: String!
  slug: String!
  description: String
  productCount: Int!
  parentId: ID
  level: Int!
  children: [CategoryWithCounts!]!
  isActive: Boolean!
  displayOrder: Int!
  imageUrl: String
}

type PopularProduct {
  id: ID!
  name: String!
  price: Float!
  stock: Int!
  orderCount: Int!
  revenue: Float!
}

enum PopularityPeriod {
  WEEK
  MONTH
  QUARTER
  YEAR
}

input CreateCategoryInput {
  name: String!
  description: String
}

input UpdateCategoryInput {
  name: String
  description: String
}



extend type Query {
  categories: [Category!]! 
    @guard(with: ["api"]) 
    @paginate(
      defaultCount: 20,
      maxCount: 100,
      builder: "App\\Modules\\Category\\GraphQL\\Queries\\CategoryQuery@categories"
    )
  category(id: ID!): Category 
    @guard(with: ["api"]) 
    @can(ability: "view", model: "App\\Models\\Category")
    @find(model: "App\\Models\\Category")

  # === NOUVELLES API ENRICHIES ===
  
  # Catégories avec compteurs et informations enrichies
  categoriesWithCounts: [CategoryWithCounts!]!
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Category\\GraphQL\\Queries\\CategoryEnrichedQuery@getCategoriesWithCounts")

  # Produits populaires par catégorie
  popularProductsByCategory(
    categoryId: ID!
    limit: Int = 5
    period: PopularityPeriod = MONTH
  ): [PopularProduct!]!
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Category\\GraphQL\\Queries\\CategoryEnrichedQuery@getPopularProductsByCategory")
}

extend type Mutation {
  createCategory(input: CreateCategoryInput!): Category
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Category\\GraphQL\\Mutations\\CategoryMutator@createCategory")

  updateCategory(id: ID!, input: UpdateCategoryInput!): Category
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Category\\GraphQL\\Mutations\\CategoryMutator@updateCategory")

  deleteCategory(id: ID!): DeleteResponse
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Category\\GraphQL\\Mutations\\CategoryMutator@deleteCategory")

  attachCategoryToProduct(category_id: ID!, product_id: ID!): Category
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Category\\GraphQL\\Mutations\\CategoryMutator@attachCategoryToProduct")

  detachCategoryFromProduct(category_id: ID!, product_id: ID!): Category
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Category\\GraphQL\\Mutations\\CategoryMutator@detachCategoryFromProduct")
}