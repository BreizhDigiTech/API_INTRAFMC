type Order {
  id: ID!
  user_id: Int!
  user: User!
  total: Float!
  status: String!
  created_at: DateTime
  updated_at: DateTime
  
  # Relations avec les produits
  products: [ProductCBD!]! @belongsToMany(relation: "products")
  orderProducts: [OrderProduct!]!
  
  # Accesseurs calculés
  total_items: Int!
  product_count: Int!
  formatted_status: String!
}

type OrderProduct {
  id: ID!
  order_id: Int!
  product_id: Int!
  quantity: Int!
  unit_price: Float!
  created_at: DateTime
  updated_at: DateTime
  
  # Relations
  order: Order @belongsTo
  product: ProductCBD @belongsTo
}

type OrderProductPivot {
  quantity: Int!
  unit_price: Float!
  created_at: DateTime
  updated_at: DateTime
}

# Expose pivot data when ProductCBD is returned through Order.products
extend type ProductCBD {
  pivot: OrderProductPivot @field(resolver: "App\\Modules\\Order\\GraphQL\\Resolvers\\OrderProductPivotResolver@resolve")
}

type OrderStats {
  order_id: ID!
  total_items: Int!
  product_count: Int!
  total_amount: Float!
  average_item_price: Float!
  created_at: DateTime!
  status: String!
  formatted_status: String!
}

type OrderSummary {
  id: ID!
  total: Float!
  status: String!
  user_name: String!
  product_count: Int!
  total_items: Int!
  created_at: DateTime!
}

input UpdateOrderStatusInput {
  id: ID!
  status: String!
}

extend type Mutation {
  checkout: Order
    @guard
    @field(resolver: "App\\Modules\\Order\\GraphQL\\Mutations\\OrderMutator@checkout")

  cancelOrder(id: ID!): Boolean
    @guard
    @field(resolver: "App\\Modules\\Order\\GraphQL\\Mutations\\OrderMutator@cancelOrder")

  updateOrderStatus(input: UpdateOrderStatusInput!): Order
    @guard
    @field(resolver: "App\\Modules\\Order\\GraphQL\\Mutations\\OrderMutator@updateOrderStatus")
}

extend type Query {
  # Toutes les commandes - Admin uniquement avec pagination automatique
  orders: [Order!]!
    @guard
    @can(ability: "viewAny", model: "App\\Models\\Order")
    @paginate(defaultCount: 15, maxCount: 100, builder: "App\\Modules\\Order\\GraphQL\\Queries\\OrderQuery@orders")

  # Mes commandes - Utilisateur connecté avec pagination automatique
  myOrders: [Order!]!
    @guard
    @paginate(defaultCount: 10, maxCount: 50, builder: "App\\Modules\\Order\\GraphQL\\Queries\\OrderQuery@myOrders")

  # Détail d'une commande - Avec vérification de propriété
  order(id: ID!): Order
    @guard
    @field(resolver: "App\\Modules\\Order\\GraphQL\\Queries\\OrderQuery@order")

  # Détails complets d'une commande avec toutes les relations
  orderDetails(id: ID!): Order
    @guard
    @field(resolver: "App\\Modules\\Order\\GraphQL\\Queries\\OrderQuery@orderDetails")

  # Statistiques d'une commande
  orderStats(id: ID!): OrderStats
    @guard
    @field(resolver: "App\\Modules\\Order\\GraphQL\\Queries\\OrderQuery@orderStats")
}
