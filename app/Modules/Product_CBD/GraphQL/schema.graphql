extend type Query {
  productsCBD(
    first: Int = 20
    page: Int
    name: String @where(operator: "like")
    category_id: ID @eq
  ): [ProductCBD!]! @paginate(defaultCount: 20)
  
  productCBD(id: ID! @eq): ProductCBD @find

  # Recherche avancée de produits
  searchProducts(
    query: String
    first: Int = 20
    page: Int
    category_id: ID
    min_price: Float
    max_price: Float
    in_stock: Boolean
  ): [ProductCBD!]! @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Queries\\ProductSearchQuery@search")

  # Recherche rapide par nom
  searchProductsByName(
    name: String!
    limit: Int = 10
  ): [ProductCBD!]! @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Queries\\ProductSearchQuery@searchByName")

  # Suggestions de recherche (autocomplétion)
  productSuggestions(
    query: String!
  ): [String!]! @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Queries\\ProductSearchQuery@suggestions")

  # Aliases legacy pour compatibilité tests existants
  products(
    first: Int = 20
    page: Int
  ): [ProductCBD!]! @paginate(defaultCount: 20)

  product(id: ID! @eq): ProductCBD @find
  
  # === NOUVELLES API INSIGHTS ET PERFORMANCE ===
  
  # Insights de performance des produits
  productPerformanceInsights(
    productId: ID
    startDate: Date
    endDate: Date
    limit: Int = 10
  ): ProductInsights!
    @guard(with: ["api"])
    @can(ability: "viewAny", model: "App\\Models\\ProductCBD")
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Queries\\ProductInsightsQuery@getProductPerformanceInsights")
  
  # Tendances par catégorie
  categoryTrends(
    startDate: Date
    endDate: Date
    groupBy: TrendGrouping = MONTH
  ): [CategoryTrend!]!
    @guard(with: ["api"])
    @can(ability: "viewAny", model: "App\\Models\\ProductCBD")
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Queries\\ProductInsightsQuery@getCategoryTrends")
}

extend type Mutation {
  createProductCBD(input: CreateProductCBDInput!): ProductCBD! 
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Mutations\\ProductCBDMutator@create")
  
  updateProductCBD(id: ID!, input: UpdateProductCBDInput!): ProductCBD! 
    @guard(with: ["api"])
    @can(ability: "update", model: "App\\Models\\ProductCBD", find: "id")
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Mutations\\ProductCBDMutator@update")
  
  deleteProductCBD(id: ID!): DeleteResponse! 
    @guard(with: ["api"])
    @can(ability: "delete", model: "App\\Models\\ProductCBD", find: "id")
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Mutations\\ProductCBDMutator@delete")
  
  uploadProductImages(
    productId: ID!
    images: [Upload!]!
  ): [FileUploadResponse!]! 
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Mutations\\ProductCBDMutator@uploadImages")

  # Supprimer des images spécifiques d'un produit
  removeProductImages(
    product_id: ID!
    image_paths: [String!]!
  ): ProductCBD!
    @guard(with: ["api"])
    @can(ability: "update", model: "App\\Models\\ProductCBD", find: "product_id")
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Mutations\\RemoveProductImages")

  # Supprimer toutes les images d'un produit
  clearProductImages(
    product_id: ID!
  ): ProductCBD!
    @guard(with: ["api"])
    @can(ability: "update", model: "App\\Models\\ProductCBD", find: "product_id")
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Mutations\\ClearProductImages")

  # Upload du fichier d'analyse (Upload top-level)
  uploadProductAnalysisFile(
    product_id: ID!
    file: Upload!
  ): ProductCBD!
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Mutations\\UploadProductAnalysisFile")

  # Création avec fichiers en arguments top-level (compat clients multipart)
  createProductCBDWithFiles(
    name: String!
    description: String
    price: Float!
    stock: Int! = 0
    category_id: ID
    category_ids: [ID!]
    images: [Upload!]
    image_metadata: JSON
    analysis_file: Upload
  ): ProductCBD!
    @guard(with: ["api"])
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Mutations\\ProductCBDCreateWithFiles")

  # Aliases legacy pour compat: chemin simple via directives intégrées
  createProduct(input: CreateProductInput! @spread): ProductCBD!
    @guard(with: ["api"])
    @create(model: "App\\Models\\ProductCBD")

  updateProduct(id: ID!, input: UpdateProductInput! @spread): ProductCBD!
    @guard(with: ["api"])
    @can(ability: "update", model: "App\\Models\\ProductCBD", find: "id")
    @update(model: "App\\Models\\ProductCBD")

  deleteProduct(id: ID!): DeleteResponse!
    @guard(with: ["api"])
    @can(ability: "delete", model: "App\\Models\\ProductCBD", find: "id")
    @field(resolver: "App\\Modules\\Product_CBD\\GraphQL\\Mutations\\ProductCBDMutator@delete")
}

# Alias legacy d'inputs pour compatibilité avec anciens tests
input CreateProductInput {
  name: String! @rules(apply: ["required", "string", "max:255", "unique:cbd_products,name"])
  description: String @rules(apply: ["string"])
  price: Float! @rules(apply: ["required", "numeric", "min:0"])
  stock: Int! @rules(apply: ["required", "integer", "min:0"])
  category_id: ID @rules(apply: ["exists:categories,id"])
  category_ids: [ID!]
  images: [Upload]
  analysis_image: Upload
}

input UpdateProductInput {
  name: String @rules(apply: ["string", "max:255"])
  description: String @rules(apply: ["string"])
  price: Float @rules(apply: ["numeric", "min:0"])
  stock: Int @rules(apply: ["integer", "min:0"])
  category_id: ID @rules(apply: ["exists:categories,id"])
  category_ids: [ID!]
  images: [Upload]
  analysis_image: Upload
}

type ProductCBD {
    id: ID!
    name: String!
    description: String
    price: Float!
    images: [String!]
    image_urls: [String!]
    image_metadata: JSON
    stock: Int!
    analysis_file: String
    analysis_file_url: String
    analysis_file_original_name: String
    analysis_file_size: Int
    analysis_file_mime_type: String
    category_id: ID
    category: Category
    categories: [Category!]! @belongsToMany
    created_at: DateTime
    updated_at: DateTime
}

input CreateProductCBDInput {
  name: String! @rules(apply: ["required", "string", "max:255", "unique:cbd_products,name"])
  description: String @rules(apply: ["string"])
  price: Float! @rules(apply: ["required", "numeric", "min:0"])
  stock: Int! @rules(apply: ["required", "integer", "min:0"])
  category_id: ID @rules(apply: ["exists:categories,id"])
  category_ids: [ID!]
  images: [Upload]
  analysis_file: Upload
  # Alias legacy pour compat avec certains tests
  analysis_image: Upload
}

input UpdateProductCBDInput {
  name: String @rules(apply: ["string", "max:255"])
  description: String @rules(apply: ["string"])
  price: Float @rules(apply: ["numeric", "min:0"])
  stock: Int @rules(apply: ["integer", "min:0"])
  category_id: ID @rules(apply: ["exists:categories,id"])
  category_ids: [ID!]
  images: [Upload]
  analysis_file: Upload
  # Alias legacy pour compat
  analysis_image: Upload
}

# === TYPES POUR INSIGHTS ET PERFORMANCE ===

type ProductInsights {
  # Insights pour un produit spécifique
  productId: ID
  productName: String
  currentPrice: Float
  currentStock: Int
  baseMetrics: ProductBaseMetrics
  timelinePerformance: ProductTimelinePerformance
  competitiveAnalysis: ProductCompetitiveAnalysis
  predictions: ProductPredictions
  recommendations: [ProductRecommendation!]
  lastUpdated: DateTime
  
  # Insights pour plusieurs produits
  timeRange: InsightsTimeRange
  topPerformers: [ProductPerformer!]
  decliningProducts: [ProductPerformer!]
  opportunities: [ProductOpportunity!]
  globalInsights: GlobalProductInsights
  summary: ProductInsightsSummary
}

type ProductBaseMetrics {
  totalOrders: Int!
  totalQuantitySold: Int!
  totalRevenue: Float!
  averageUnitPrice: Float!
  uniqueCustomers: Int!
  conversionRate: Float!
  returnRate: Float!
  reorderRate: Float!
  profitMargin: Float!
}

type ProductTimelinePerformance {
  periods: [ProductPeriodData!]!
  trend: TrendDirection!
  seasonality: String
  volatility: Float!
  growthRate: Float!
}

type ProductPeriodData {
  period: String!
  orders: Int!
  quantitySold: Int!
  revenue: Float!
  averageOrderValue: Float!
}

type ProductCompetitiveAnalysis {
  topCompetitors: [CompetitorProduct!]!
  marketShare: Float!
  pricePositioning: PricePositioning!
  competitiveAdvantages: [String!]!
}

type CompetitorProduct {
  productId: ID!
  productName: String!
  price: Float!
  revenue: Float!
  orders: Int!
}

type ProductPredictions {
  nextMonthRevenue: Float
  nextMonthQuantity: Int
  confidence: Float!
  recommendation: String!
  riskFactors: [String!]!
}

type ProductRecommendation {
  type: RecommendationType!
  priority: RecommendationPriority!
  title: String!
  description: String!
  expectedImpact: String!
}

type CategoryTrend {
  categoryId: ID!
  categoryName: String!
  periods: [CategoryPeriodData!]!
  totalRevenue: Float!
  totalOrders: Int!
  trend: TrendDirection!
  growthRate: Float!
  marketShare: Float!
}

type CategoryPeriodData {
  period: String!
  revenue: Float!
  orders: Int!
  quantity: Int!
}

type ProductPerformer {
  productId: ID!
  productName: String!
  currentPrice: Float!
  revenue: Float!
  growthRate: Float!
  trendDirection: TrendDirection!
  score: Float!
}

type ProductOpportunity {
  productId: ID!
  productName: String!
  opportunityType: OpportunityType!
  description: String!
  potentialImpact: String!
  difficulty: DifficultyLevel!
}

type GlobalProductInsights {
  totalProductsAnalyzed: Int!
  averageGrowthRate: Float!
  topPerformingCategory: String!
  decliningCategory: String!
  marketTrends: [MarketTrend!]!
}

type MarketTrend {
  trend: String!
  impact: TrendImpact!
  description: String!
}

type ProductInsightsSummary {
  topPerformersCount: Int!
  decliningProductsCount: Int!
  opportunitiesCount: Int!
  overallHealthScore: Float!
}

type InsightsTimeRange {
  startDate: Date!
  endDate: Date!
}

enum TrendGrouping {
  DAY
  WEEK
  MONTH
  QUARTER
  YEAR
}

enum PricePositioning {
  PREMIUM
  AVERAGE
  BUDGET
  COMPETITIVE
}

enum RecommendationType {
  PRICE_OPTIMIZATION
  INVENTORY_MANAGEMENT
  MARKETING_BOOST
  QUALITY_IMPROVEMENT
  CATEGORY_EXPANSION
  SEASONAL_STRATEGY
}

enum RecommendationPriority {
  CRITICAL
  HIGH
  MEDIUM
  LOW
}

enum OpportunityType {
  UNDERPRICED
  OVERPRICED
  STOCK_OPTIMIZATION
  MARKETING_POTENTIAL
  SEASONAL_OPPORTUNITY
  CROSS_SELL_POTENTIAL
}

enum DifficultyLevel {
  EASY
  MEDIUM
  HARD
  COMPLEX
}

enum TrendImpact {
  POSITIVE
  NEGATIVE
  NEUTRAL
  MIXED
}