# Schéma GraphQL pour l'enregistrement

type SuccessResponse {
  success: Boolean!
  message: String!
}

extend type Mutation {
  # Enregistrement utilisateur
  register(
    name: String!,
    email: String!,
    password: String!,
    password_confirmation: String!,
    avatar: String
  ): AuthPayload @field(resolver: "App\\Modules\\Register\\GraphQL\\Mutations\\RegisterMutator@register")

  # Vérification d'email
  verifyEmail(
    token: String!
  ): SuccessResponse @field(resolver: "App\\Modules\\Register\\GraphQL\\Mutations\\RegisterMutator@verifyEmail")

  # Renvoyer l'email de vérification
  resendVerificationEmail(
    email: String! @rules(apply: ["email"])
  ): SuccessResponse @field(resolver: "App\\Modules\\Register\\GraphQL\\Mutations\\RegisterMutator@resendVerificationEmail")
}




