# Types pour les nouvelles APIs d'optimisation

enum TrendDirection {
    UP
    DOWN
    STABLE
}

type OrdersSummary {
    totalOrders: Int!
    pendingOrders: Int!
    validatedOrders: Int!
    cancelledOrders: Int!
    totalRevenue: Float!
}

type UsersSummary {
    totalUsers: Int!
    activeUsers: Int!
    inactiveUsers: Int!
    adminUsers: Int!
    recentRegistrations: Int!
}

type CategoryList {
    id: ID!
    name: String!
    slug: String
    description: String
    products_count: Int!
}

type EcommerceSummary {
    totalProducts: Int!
    totalCategories: Int!
    lowStockProducts: Int!
    outOfStockProducts: Int!
    totalValue: Float!
    averagePrice: Float!
}

type OrdersStats {
    total: Int!
    thisMonth: Int!
    lastMonth: Int!
    growth: Float!
}

type RevenueStats {
    total: Float!
    thisMonth: Float!
    lastMonth: Float!
    growth: Float!
}

type UsersStats {
    total: Int!
    active: Int!
    newThisMonth: Int!
}

type ProductsStats {
    total: Int!
    lowStock: Int!
    outOfStock: Int!
}

type DashboardStats {
    orders: OrdersStats!
    revenue: RevenueStats!
    users: UsersStats!
    products: ProductsStats!
}

type UserProfile {
    id: ID!
    name: String!
    email: String!
    phone: String
    address: String
    birth_date: String
    avatar: String
    created_at: DateTime!
    updated_at: DateTime!
    email_verified_at: DateTime
    last_login: DateTime
    orders_count: Int!
    total_spent: Float!
    preferences: UserPreferences!
}

type UserPreferences {
    theme: String!
    language: String!
    notifications: Boolean!
}

type TokenValidation {
    valid: Boolean!
    expires_at: DateTime
    user: TokenUser
}

type TokenUser {
    id: ID!
    name: String!
    email: String!
    is_admin: Boolean!
}

# Extension des Queries existantes
extend type Query {
    # Statistiques rapides
    ordersSummary: OrdersSummary! @field(resolver: "App\\GraphQL\\Queries\\OrdersSummaryQuery")
    usersSummary: UsersSummary! @field(resolver: "App\\GraphQL\\Queries\\UsersSummaryQuery")
    ecommerceSummary: EcommerceSummary! @field(resolver: "App\\GraphQL\\Queries\\EcommerceSummaryQuery")
    dashboardStatsOptimized: DashboardStats! @field(resolver: "App\\GraphQL\\Queries\\DashboardStatsQuery")
    
    # Listes optimisées
    categoriesList: [CategoryList!]! @field(resolver: "App\\GraphQL\\Queries\\CategoriesListQuery")
    
    # Recherches avancées
    usersSearch(
        search: String
        role: String
        status: String
        first: Int = 15
        page: Int = 1
    ): [User!]! @paginate(defaultCount: 15, maxCount: 50, builder: "App\\GraphQL\\Queries\\UsersSearchQuery")
    
    productsSearch(
        search: String
        category: ID
        minPrice: Float
        maxPrice: Float
        inStock: Boolean
        first: Int = 20
        page: Int = 1
    ): [ProductCBD!]! @paginate(defaultCount: 20, maxCount: 100, builder: "App\\GraphQL\\Queries\\ProductsSearchQuery")
    
    # Profil complet
    myProfileComplete: UserProfile! @field(resolver: "App\\GraphQL\\Queries\\MyProfileCompleteQuery") @guard(with: ["api"])
    
    # Validation token
    validateToken: TokenValidation! @field(resolver: "App\\GraphQL\\Queries\\ValidateTokenQuery")
}
