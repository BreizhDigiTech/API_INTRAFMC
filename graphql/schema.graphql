"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime
  @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"A date string with format `Y-m-d`, e.g. `2018-05-23`."
scalar Date
  @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

"Can be used as an argument to upload files using multipart/form-data."
scalar Upload
  @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Upload")

"Arbitrary JSON value."
scalar JSON
  @scalar(class: "App\\GraphQL\\Scalars\\JSON")

type DeleteResponse {
    success: Boolean
    message: String
}

type SuccessResponse {
    success: Boolean!
    message: String!
}

type FileUploadResponse {
    success: Boolean!
    message: String!
    url: String
    path: String
}

type ChangePasswordResponse {
    success: Boolean
    message: String
}