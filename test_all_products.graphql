# Test de la requête allProductsCBD pour récupérer tous les produits

query TestAllProducts {
  allProductsCBD(limit: 500) {
    id
    name
    price
    created_at
    updated_at
  }
}

# Compter le nombre total de produits
query CountProducts {
  productsCBD(first: 1) {
    paginatorInfo {
      total
      count
      currentPage
      lastPage
    }
  }
}
